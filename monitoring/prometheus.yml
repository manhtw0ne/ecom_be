# Prometheus Configuration — Ecom BE Monitoring
# Scrapes metrics from Spring Boot Actuator every 15 seconds

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ecom-be"
    # Spring Boot actuator prometheus endpoint
    # NOTE: host.docker.internal allows Prometheus container to reach
    # the Spring Boot app running on the host machine
    metrics_path: "/api/v1/actuator/prometheus"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/actuator.token
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "ecom-be"

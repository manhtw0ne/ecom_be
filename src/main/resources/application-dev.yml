# ─────────────────────────────────────────────────────────────────────────────
# Development Profile — used when running locally with ./mvnw spring-boot:run
# Start infrastructure first: docker compose -f docker-compose-infra.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

jwt:
  # Dev-only default key. Never commit real secrets. Production requires JWT_SECRET env var.
  secretKey: ${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQtMzItYnl0ZXM=}

# Swagger UI enabled in dev — disabled in prod
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    enabled: true
    path: /api-docs

logging:
  level:
    com.manh.ecom_be: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

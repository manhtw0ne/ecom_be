# ─────────────────────────────────────────────────────────────────────────────
# Production Profile — requires the following environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
# Optional: REDIS_HOST, REDIS_PASSWORD, KAFKA_BOOTSTRAP_SERVERS
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

jwt:
  secretKey: ${JWT_SECRET}

# Swagger UI is disabled in production for security
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    com.manh.ecom_be: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Production server forward headers (behind Nginx/proxy)
server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

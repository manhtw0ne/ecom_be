# ─────────────────────────────────────────────────────────────────────────────
# Production Profile
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
# Optional: REDIS_HOST, REDIS_PASSWORD, KAFKA_BOOTSTRAP_SERVERS
# Cloud Redis (Upstash): also set SPRING_DATA_REDIS_SSL_ENABLED=true
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        # Set SPRING_DATA_REDIS_SSL_ENABLED=true when using Upstash or other TLS Redis
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secretKey: ${JWT_SECRET}

# Swagger UI disabled in prod — enable for demo with SPRINGDOC_SWAGGER_UI_ENABLED=true
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
  api-docs:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /api-docs

logging:
  level:
    root: INFO
    com.manh.ecom_be: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Production server: behind Nginx/Render proxy
server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
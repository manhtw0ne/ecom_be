spring:
  application:
    name: ecom
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      use-redis-cache: true
      use-redisson: true
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.type.mapping]": "category:com.manh.ecom_be.models.Category"
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      group-id: ecom_db-group
      auto-offset-reset: earliest
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-disabled}
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:4300/auth/google/callback}"
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:local-disabled}
            client-secret: ${FACEBOOK_CLIENT_SECRET:local-disabled}
            redirect-uri: "${FACEBOOK_REDIRECT_URI:http://localhost:4300/auth/facebook/callback}"
            token-uri: https://graph.facebook.com/v13.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  messages:
    basename: i18n/messages
    encoding: UTF-8
    default-locale: en
jwt:
  expiration: 2592000
  expiration-refresh-token: 31536000
api:
  prefix: /api/v1
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
app:
  rate-limit:
    enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redisCustom,kafkaCustom
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health,info,metrics,prometheus
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: simple
  metrics:
    tags:
      application: ecom-be
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
vnpay:
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: "${VNPAY_RETURN_URI:http://localhost:4200/payments/payment-callback}"
  tmn-code: ${VNPAY_TMN_CODE:disabled}
  secret-key: ${VNPAY_SECRET_KEY:disabled}
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
  data:
    redis:
      use-redis-cache: false
      use-redisson: false
app:
  rate-limit:
    enabled: false
management:
  health:
    redis:
      enabled: false
jwt:
  secretKey: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0cy1vbmx5LTEyMzQ1Njc4OTA=
logging:
  level:
    root: WARN

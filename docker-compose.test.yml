name: ecom-verification
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecom_test
      MYSQL_USER: ecom
      MYSQL_PASSWORD: test-password
      MYSQL_ROOT_PASSWORD: test-root-password
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u ecom ecom_test -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2.3
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
